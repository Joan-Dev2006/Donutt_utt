<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DonUTT - Prototype Interactif Final</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 20px; color: #1a1a1a; }
        
        /* Layout recentré */
        .dashboard-container { display: flex; justify-content: center; align-items: center; max-width: 1200px; margin: 0 auto; min-height: 95vh; }
        #chart-container { position: relative; display: flex; justify-content: center; align-items: center;}
        
        /* Boutons de la modale */
        .btn { display: inline-block; padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; color: white; display: flex; align-items: center; gap: 10px; }
        .btn-primary { background: #1e375a; }
        .btn-primary:hover { background: #112138; transform: translateY(-2px); }
        .btn-secondary { background: #00b4e8; }
        .btn-secondary:hover { background: #0089bd; transform: translateY(-2px); }

        /* Infobulle simple */
        .tooltip { position: absolute; padding: 8px 12px; background: #1e375a; color: white; border-radius: 4px; pointer-events: none; opacity: 0; font-size: 13px; font-weight: bold; z-index: 10; transition: opacity 0.1s;}

        /* FENÊTRE MODALE */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: #ffffff; width: 850px; border-radius: 12px; padding: 40px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.15); border: 1px solid #e0e0e0; }
        .modal-close { position: absolute; top: -15px; right: -15px; background: #136a4b; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: background 0.2s;}
        .modal-close:hover { background: #0d4a34; }
        
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 30px; gap: 30px; align-items: center;}
        .modal-title { font-size: 34px; font-weight: 800; color: #1a1a1a; margin: 0; flex: 1; line-height: 1.1;}
        .modal-desc { flex: 1.5; font-size: 14px; color: #4a4a4a; line-height: 1.5; border-left: 2px solid #ecf0f1; padding-left: 15px;}
        
        .modal-cards { display: flex; gap: 15px; margin-bottom: 30px; }
        .card { flex: 1; background: #136a4b; color: white; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between;}
        .card h3 { margin: 0 0 10px 0; font-size: 18px; font-weight: 700; }
        .card p { margin: 0; font-size: 13px; line-height: 1.4; opacity: 0.95; }
        .card .big-val { font-size: 24px; font-weight: bold; margin-top: auto;}
        
        .measure-section { display: flex; align-items: center; gap: 40px; margin-top: 20px;}
        .measure-value-box h3 { margin: 0 0 5px 0; font-size: 20px; color: #1a1a1a; }
        .measure-val-number { font-size: 60px; font-weight: 800; color: #1a1a1a; line-height: 1; letter-spacing: -2px;}
        .measure-val-total { font-size: 20px; color: #7f8c8d; font-weight: 600; }
        
        .gauge-container { flex: 1; position: relative; margin-top: 20px;}
        .gauge-bar { height: 40px; background: linear-gradient(to right, #ff0000, #ff9900, #ffff00, #99ff33, #00ff00); border-radius: 6px; width: 100%; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);}
        .gauge-marker { position: absolute; top: -30px; font-size: 35px; color: #1e375a; transform: translateX(-50%); transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1); text-shadow: 0 3px 6px rgba(0,0,0,0.3);}
        .gauge-labels { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #4a4a4a; font-weight: 600; padding: 0 5px;}

        /* Section Import/Export */
        .modal-actions { margin-top: 35px; padding-top: 25px; border-top: 1px solid #e0e0e0; display: flex; gap: 15px; justify-content: flex-end; align-items: center; }
        .modal-actions-text { flex: 1; font-size: 13px; color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Zone du Graphique Centré -->
        <div id="chart-container">
            <div id="chart"><div class="tooltip" id="tooltip"></div></div>
        </div>
    </div>

    <!-- FENÊTRE MODALE -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal(event)"><i class="fas fa-times"></i></button>
            
            <div class="modal-header">
                <h2 class="modal-title" id="m-title">Titre</h2>
                <div class="modal-desc" id="m-desc">Description.</div>
            </div>
            
            <div class="modal-cards">
                <div class="card"><h3>Données</h3><p id="m-donnees">Source</p></div>
                <div class="card"><h3>Indicateur</h3><p id="m-indicateur">Mesure</p></div>
                <div class="card"><h3>Seuil</h3><div class="big-val" id="m-seuil">2.5/5</div></div>
            </div>
            
            <div class="measure-section">
                <div class="measure-value-box">
                    <h3>Mesure Actuelle</h3>
                    <span class="measure-val-number" id="m-val">2.5</span><span class="measure-val-total" id="m-val-total">/5</span>
                </div>
                <div class="gauge-container">
                    <div class="gauge-marker" id="m-marker" style="left: 50%;">▼</div>
                    <div class="gauge-bar"></div>
                    <div class="gauge-labels"><span>Danger (5)</span><span>Seuil (2.5)</span><span>Sûr (1)</span></div>
                </div>
            </div>

            <!-- INTERFACE UTILISATEUR D'IMPORT/EXPORT -->
            <div class="modal-actions">
                <div class="modal-actions-text">Mise à jour de cet indicateur :</div>
                
                <button class="btn btn-secondary" onclick="simulateDownload()"><i class="fas fa-download"></i> Télécharger données</button>
                
                <!-- Le champ de fichier invisible et son bouton -->
                <input type="file" id="csvFileInput" accept=".csv, .xlsx" style="display: none;" onchange="handleFileUpload(event)">
                <button class="btn btn-primary" onclick="document.getElementById('csvFileInput').click()"><i class="fas fa-upload"></i> Importer nouvelle mesure</button>
            </div>
        </div>
    </div>

    <script>
        // 1. GESTION DE L'IMPORTATION DE FICHIERS (PROTOTYPE)
        function simulateDownload() {
            let indicator = document.getElementById('m-title').innerText;
            alert(`Simulation : Le fichier d'historique des données pour "${indicator}" a été téléchargé sur votre ordinateur.`);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                let indicator = document.getElementById('m-title').innerText;
                // Pop-up de confirmation
                alert(`Le fichier '${file.name}' a été importé avec succès !\n\nL'algorithme de la plateforme DonUTT va analyser ces nouvelles données pour recalculer le score de l'indicateur "${indicator}".`);
                
                // Réinitialise l'input pour pouvoir re-sélectionner le même fichier au besoin
                event.target.value = '';
                
                // Ferme la modale pour montrer que l'action est terminée
                closeModal();
            }
        }

        function closeModal(e) { 
            document.getElementById('modal-overlay').style.display = 'none'; 
        }

        // 2. MOTEUR GRAPHIQUE D3.JS
        const width = 1100; // Canevas agrandi pour éviter que les textes extérieurs ne soient rognés
        const height = 1100;
        const center = width / 2;

        const rLogo = 65;          
        const rSocInner = 160;     
        const rEcoOuter = 320;     
        const rEcoMax = 470;       

        const colCyan = "#00b4e8";      
        const colDarkBlue = "#1e375a";  
        const colLightBg = "#f4fbfe";   
        const colRed = "#e62e2d"; 
        const colScale = "rgba(30, 55, 90, 0.25)";      

        const imageMap = {
            "GES_01": "img/co2.png", "SOL_01": "img/arbre.png", "AIR_01": "img/vent.png",
            "BIO_01": "img/canard.png", "EAU_01": "img/goutte.png", "SAN_01": "img/sante.png",
            "COH_01": "img/poignee.png", "JUS_01": "img/justice.png", "TRA_01": "img/travail.png"
        };
        const shortSocMap = { "SAN_01": "SANTÉ", "COH_01": "COHÉSION", "JUS_01": "JUSTICE", "TRA_01": "TRAVAIL & ÉTUDES" };

        const svg = d3.select("#chart").append("svg")
            .attr("width", width).attr("height", height)
            .append("g").attr("transform", `translate(${center}, ${center})`);

        svg.append("defs").append("marker")
            .attr("id", "arrowHead").attr("viewBox", "0 0 10 10")
            .attr("refX", 5).attr("refY", 5).attr("markerWidth", 6).attr("markerHeight", 6)
            .attr("orient", "auto-start-reverse")
            .append("path").attr("d", "M 0 0 L 10 5 L 0 10 z").attr("fill", colDarkBlue);

        const defs = svg.select("defs");

        const ecoGrad = defs.append("radialGradient").attr("id", "gradEco").attr("gradientUnits", "userSpaceOnUse").attr("cx", 0).attr("cy", 0).attr("r", rEcoMax);
        ecoGrad.append("stop").attr("offset", (rEcoOuter / rEcoMax) * 100 + "%").attr("stop-color", colRed);
        ecoGrad.append("stop").attr("offset", "100%").attr("stop-color", "rgba(255, 255, 255, 0)");

        const socGrad = defs.append("radialGradient").attr("id", "gradSoc").attr("gradientUnits", "userSpaceOnUse").attr("cx", 0).attr("cy", 0).attr("r", rSocInner);
        socGrad.append("stop").attr("offset", "15%").attr("stop-color", "rgba(255, 255, 255, 0)");
        socGrad.append("stop").attr("offset", "100%").attr("stop-color", colRed);

        function getTextPath(d, radius) {
            const angle = (d.startAngle + d.endAngle) / 2;
            const isBottom = angle > Math.PI / 2 && angle < 3 * Math.PI / 2;
            let start = d.startAngle, end = d.endAngle;
            if (isBottom) {
                return `M ${Math.sin(end)*radius} ${-Math.cos(end)*radius} A ${radius} ${radius} 0 0 0 ${Math.sin(start)*radius} ${-Math.cos(start)*radius}`;
            } else {
                return `M ${Math.sin(start)*radius} ${-Math.cos(start)*radius} A ${radius} ${radius} 0 0 1 ${Math.sin(end)*radius} ${-Math.cos(end)*radius}`;
            }
        }

        d3.json("data/donutt_prototype.json").then(data => {
            const dataEco = data.indicateurs.filter(d => d.type === "Ecologique");
            const dataSoc = data.indicateurs.filter(d => d.type === "Social");
            const pie = d3.pie().value(1).sort(null).padAngle(0); 
            const arcsEco = pie(dataEco);
            const arcsSoc = pie(dataSoc);

            defs.selectAll(".textPath").data([...arcsSoc, ...arcsEco]).join("path")
                .attr("id", (d, i) => "text-path-" + i)
                .attr("d", d => getTextPath(d, d.data.type === "Social" ? rSocInner - 25 : rEcoMax + 20));

            // FOND DES VIDES
            svg.selectAll(".bg-eco").data(arcsEco).join("path").attr("d", d3.arc().innerRadius(rEcoOuter).outerRadius(rEcoMax)).attr("fill", colLightBg);
            svg.selectAll(".bg-soc").data(arcsSoc).join("path").attr("d", d3.arc().innerRadius(rLogo).outerRadius(rSocInner)).attr("fill", colLightBg);

            // LE CERCLE CYAN 
            svg.append("circle").attr("r", rSocInner + ((rEcoOuter - rSocInner)/2))
               .attr("fill", "none").attr("stroke", colCyan).attr("stroke-width", rEcoOuter - rSocInner);

            // ÉCHELLE DE SÉCURITÉ TRANSLUCIDE (Avec le gap)
            const maxSafeThickness = 40; 
            const gap = 0.04; 

            svg.selectAll(".scale-soc").data(arcsSoc).join("path")
                .attr("d", d => {
                    let risk = d.data.niveau_risque;
                    let thickness = risk >= 2.5 ? maxSafeThickness : maxSafeThickness * ((2.5 - risk) / 1.5); 
                    return d3.arc().innerRadius(rSocInner).outerRadius(rSocInner + thickness)
                             .startAngle(d.startAngle + gap).endAngle(d.endAngle - gap)();
                }).attr("fill", colScale);

            svg.selectAll(".scale-eco").data(arcsEco).join("path")
                .attr("d", d => {
                    let risk = d.data.niveau_risque;
                    let thickness = risk >= 2.5 ? maxSafeThickness : maxSafeThickness * ((2.5 - risk) / 1.5); 
                    return d3.arc().innerRadius(rEcoOuter - thickness).outerRadius(rEcoOuter)
                             .startAngle(d.startAngle + gap).endAngle(d.endAngle - gap)();
                }).attr("fill", colScale);

            // ÉCHELLE DE DANGER ROUGE
            function drawPetals(arcs, isEco) {
                svg.selectAll(isEco ? ".red-eco" : ".red-soc").data(arcs).join("path")
                    .attr("d", d => {
                        let excess = Math.max(0, d.data.niveau_risque - 2.5); 
                        if (excess === 0) return ""; 
                        if (isEco) {
                            let thickness = (rEcoMax - rEcoOuter) * (excess / 2.5); 
                            return d3.arc().innerRadius(rEcoOuter).outerRadius(rEcoOuter + thickness).startAngle(d.startAngle).endAngle(d.endAngle)();
                        } else {
                            let thickness = (rSocInner - rLogo) * (excess / 2.5);
                            return d3.arc().innerRadius(rSocInner - thickness).outerRadius(rSocInner).startAngle(d.startAngle).endAngle(d.endAngle)();
                        }
                    }).attr("fill", isEco ? "url(#gradEco)" : "url(#gradSoc)");
            }
            drawPetals(arcsEco, true);
            drawPetals(arcsSoc, false);

            // LIGNES BLANCHES DE SÉPARATION
            arcsSoc.forEach(d => {
                svg.append("line").attr("x1", Math.sin(d.startAngle)*rLogo).attr("y1", -Math.cos(d.startAngle)*rLogo)
                   .attr("x2", Math.sin(d.startAngle)*rSocInner).attr("y2", -Math.cos(d.startAngle)*rSocInner).attr("stroke", "white").attr("stroke-width", 10);
            });
            arcsEco.forEach(d => {
                svg.append("line").attr("x1", Math.sin(d.startAngle)*rEcoOuter).attr("y1", -Math.cos(d.startAngle)*rEcoOuter)
                   .attr("x2", Math.sin(d.startAngle)*rEcoMax).attr("y2", -Math.cos(d.startAngle)*rEcoMax).attr("stroke", "white").attr("stroke-width", 10);
            });

            // ANNEAUX SÉPARATEURS GLOBAUX
            svg.append("circle").attr("r", rSocInner).attr("fill", "none").attr("stroke", colDarkBlue).attr("stroke-width", "8px");
            svg.append("circle").attr("r", rEcoOuter).attr("fill", "none").attr("stroke", colDarkBlue).attr("stroke-width", "8px");

            // FLÈCHES ALIGNÉES
            const rMidGeom = rSocInner + (rEcoOuter - rSocInner) / 2;
            const angleExces = arcsEco[1].startAngle; 
            svg.append("line").attr("x1", Math.sin(angleExces)*(rMidGeom)).attr("y1", -Math.cos(angleExces)*(rMidGeom))
                .attr("x2", Math.sin(angleExces)*(rEcoMax-10)).attr("y2", -Math.cos(angleExces)*(rEcoMax-10))
                .attr("stroke", colDarkBlue).attr("stroke-width", 3).attr("marker-end", "url(#arrowHead)");
            svg.append("text").attr("x", Math.sin(angleExces)*(rEcoOuter+45)).attr("y", -Math.cos(angleExces)*(rEcoOuter+45)+15)
                .text("Excès").style("fill", colDarkBlue).style("font-size", "12px").style("font-weight", "bold").attr("transform", `rotate(${angleExces*180/Math.PI - 90}, ${Math.sin(angleExces)*(rEcoOuter+45)}, ${-Math.cos(angleExces)*(rEcoOuter+45)+15})`);

            const angleDeficit = arcsSoc[1].startAngle; 
            svg.append("line").attr("x1", Math.sin(angleDeficit)*(rMidGeom)).attr("y1", -Math.cos(angleDeficit)*(rMidGeom))
                .attr("x2", Math.sin(angleDeficit)*(rLogo+25)).attr("y2", -Math.cos(angleDeficit)*(rLogo+25))
                .attr("stroke", colDarkBlue).attr("stroke-width", 3).attr("marker-end", "url(#arrowHead)");
            svg.append("text").attr("x", Math.sin(angleDeficit)*(rLogo+60)).attr("y", -Math.cos(angleDeficit)*(rLogo+60)+15)
                .text("Déficit").style("fill", colDarkBlue).style("font-size", "12px").style("font-weight", "bold").attr("transform", `rotate(${angleDeficit*180/Math.PI - 90}, ${Math.sin(angleDeficit)*(rLogo+60)}, ${-Math.cos(angleDeficit)*(rLogo+60)+15})`);

            // ICÔNES
            svg.selectAll(".custom-icon").data([...arcsSoc, ...arcsEco]).join("image")
                .attr("href", d => imageMap[d.data.id])
                .attr("width", 36).attr("height", 36).attr("x", -18).attr("y", -18)
                .attr("transform", d => {
                    const radius = d.data.type === "Social" ? (rLogo + rSocInner) / 2 : rEcoOuter + 50;
                    const angle = (d.startAngle + d.endAngle) / 2;
                    return `translate(${Math.sin(angle) * radius}, ${-Math.cos(angle) * radius})`; 
                })
                .style("pointer-events", "none")
                .style("mix-blend-mode", "multiply"); 

            // TEXTES COURBÉS
            svg.selectAll(".curved-text").data([...arcsSoc, ...arcsEco]).join("text")
                .attr("dy", d => {
                    const angle = (d.startAngle + d.endAngle) / 2;
                    return (angle > Math.PI / 2 && angle < 3 * Math.PI / 2) ? 15 : -5; 
                })
                .append("textPath").attr("href", (d, i) => "#text-path-" + i).attr("startOffset", "50%")
                .style("text-anchor", "middle").style("font-size", d => d.data.type === "Social" ? "12px" : "14px")
                .style("font-weight", "bold").style("fill", colDarkBlue).style("letter-spacing", "1px")
                .text(d => d.data.type === "Social" ? shortSocMap[d.data.id] : d.data.dimension.toUpperCase());

            // LOGO CENTRAL
            const logoGroup = svg.append("g");
            logoGroup.append("rect").attr("x", -35).attr("y", -35).attr("width", 70).attr("height", 70).attr("fill", colDarkBlue).attr("rx", 5);
            logoGroup.append("ellipse").attr("cx", 0).attr("cy", 0).attr("rx", 22).attr("ry", 9).attr("fill", "none").attr("stroke", "white").attr("stroke-width", 3).attr("transform", "rotate(-20)");
            logoGroup.append("circle").attr("cx", -4).attr("cy", 2).attr("r", 4).attr("fill", "white");

            // ZONES CLIQUABLES INVISIBLES
            const tooltip = d3.select("#tooltip");
            svg.selectAll(".hitbox").data([...arcsSoc, ...arcsEco]).join("path")
                .attr("d", d => d3.arc().innerRadius(d.data.type === "Social" ? rLogo : rSocInner).outerRadius(d.data.type === "Social" ? rEcoOuter : rEcoMax).startAngle(d.startAngle).endAngle(d.endAngle)())
                .attr("fill", "transparent").style("cursor", "pointer")
                .on("mouseover", function(event, d) {
                    d3.select(this).attr("fill", "rgba(0,0,0,0.05)");
                    tooltip.style("opacity", 1).html(d.data.dimension);
                })
                .on("mousemove", function(event) {
                    const chartPos = document.getElementById("chart").getBoundingClientRect();
                    tooltip.style("left", (event.clientX - chartPos.left + 15) + "px").style("top", (event.clientY - chartPos.top + 15) + "px");
                })
                .on("mouseout", function() {
                    d3.select(this).attr("fill", "transparent");
                    tooltip.style("opacity", 0);
                })
                .on("click", function(event, d) {
                    // Les textes
                    document.getElementById('m-title').innerHTML = d.data.dimension;
                    document.getElementById('m-desc').innerHTML = d.data.description;
                    document.getElementById('m-donnees').innerHTML = d.data.source_donnees;
                    let descFormat = d.data.indicateur_desc.replace(/\n/g, "<br>");
                    document.getElementById('m-indicateur').innerHTML = descFormat;
                    document.getElementById('m-seuil').innerHTML = d.data.seuil_reference + " " + d.data.unite;
                    
                    // La Mesure
                    document.getElementById('m-val').innerHTML = d.data.valeur_mesure;
                    document.getElementById('m-val-total').innerHTML = " " + d.data.unite;

                    // La Jauge
                    let visualPos = 100 - ((d.data.niveau_risque - 1) / 4) * 100; 
                    document.getElementById('m-marker').style.left = `${Math.max(5, Math.min(95, visualPos))}%`;
                    
                    document.getElementById('modal-overlay').style.display = 'flex';
                });
        });
    </script>
</body>
</html>
